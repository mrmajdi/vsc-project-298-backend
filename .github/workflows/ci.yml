name: CI
on:
  push:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Prisma generate (if present)
        run: npx prisma generate || echo "no prisma"
      - name: Migrate (if present)
        run: npm run migrate --if-present
      - name: Seed (if present)
        run: npm run seed --if-present
      - name: Typecheck (if tsconfig present)
        run: '[ -f tsconfig.json ] && npx tsc --noEmit || echo "no tsconfig, skipping typecheck"'
      - name: Build (if present)
        run: npm run build --if-present
      - name: Test (if present)
        run: npm run test --if-present
